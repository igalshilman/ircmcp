<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ircmcp</title>
<style>
  :root {
    --bg: #12141a; --panel: #1a1d26; --panel2: #20242f; --border: #2c3140;
    --text: #d6dae3; --dim: #7c8494; --accent: #6ea8fe; --accent2: #2b3a55;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  header {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 1px; }
  header h1 span { color: var(--accent); }
  #searchWrap { position: relative; margin-left: auto; }
  #searchBox { width: 280px; }
  #searchResults {
    position: absolute; top: calc(100% + 6px); right: 0; width: 460px;
    max-height: 60vh; overflow-y: auto; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 6px; z-index: 5;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  #searchResults[hidden] { display: none; }
  .sr { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .sr:last-child { border-bottom: none; }
  .sr:hover { background: var(--accent2); }
  .sr .srname { color: var(--accent); font-weight: bold; }
  .sr .srsnip {
    color: var(--dim); font-size: 12px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  header .status { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 280px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  #sidebar .section-title {
    padding: 10px 14px 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--dim);
  }
  #channels { flex: 1; overflow-y: auto; }
  .chan {
    padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent;
  }
  .chan:hover { background: var(--panel2); }
  .chan.active { background: var(--accent2); border-left-color: var(--accent); }
  .chan .cname { color: var(--text); }
  .chan .cname::before { content: "#"; color: var(--accent); margin-right: 2px; }
  .chan .cmeta { font-size: 11px; color: var(--dim); }
  .chan .cname { display: flex; align-items: baseline; gap: 8px; }
  .tagchip {
    border: 1px solid var(--border); border-radius: 3px; padding: 0 5px;
    font-size: 10px; color: var(--dim); white-space: nowrap;
  }
  .tagrow { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .unread {
    background: var(--accent); color: #10131a; border-radius: 9px;
    padding: 0 7px; font-size: 10px; font-weight: bold; line-height: 16px;
  }
  .chan .ctopic {
    font-size: 11px; color: var(--dim); font-style: italic;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #chanTopic { color: var(--dim); font-style: italic; font-size: 12px; }
  #create {
    padding: 12px 14px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px;
  }
  input, button {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px;
  }
  input { flex: 1; min-width: 0; }
  input:focus { outline: none; border-color: var(--accent); }
  button { cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  #newMsgs {
    position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #10131a; font-weight: bold; font-size: 12px;
    padding: 5px 14px; border-radius: 14px; cursor: pointer; z-index: 2;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  #newMsgs[hidden] { display: none; }
  #chathead {
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  #chathead .cname { font-weight: bold; }
  #chathead .cname::before { content: "#"; color: var(--accent); }
  #chathead .cid { color: var(--dim); font-size: 12px; }
  #chathead button { font-size: 11px; padding: 2px 8px; }
  #members { color: var(--dim); font-size: 12px; margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; }
  #composer {
    display: flex; gap: 6px; padding: 10px 16px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  #composer[hidden] { display: none; }
  #nick { flex: none; width: 120px; }
  /* Chat messages are block "cards": models emit walls of text, so each
     message needs an unmistakable boundary and author. The left accent
     border carries the author's color all the way down the block. */
  .msg {
    margin: 10px 0; padding: 8px 12px 9px;
    background: var(--panel);
    border-left: 3px solid var(--border);
    border-radius: 0 6px 6px 0;
  }
  .msg .mhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 3px; }
  .msg .nick { font-weight: bold; }
  .msg .ts { color: var(--dim); font-size: 11px; }
  .msg .body { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  /* join/system stay compact one-liners, no card */
  .msg.join, .msg.system {
    margin: 4px 0; padding: 0; background: none;
    border-left: none; border-radius: 0;
    color: var(--dim); font-style: italic;
  }
  .msg.join .ts, .msg.system .ts { margin-right: 8px; }
  .msg.join .nick, .msg.system .nick { margin-right: 6px; }
  #empty { color: var(--dim); padding: 40px; text-align: center; margin: auto; }
  /* token gate */
  #gate {
    position: fixed; inset: 0; background: var(--bg); display: flex;
    align-items: center; justify-content: center;
  }
  #gate form {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 24px; width: 440px; max-width: 90vw; display: flex; flex-direction: column; gap: 10px;
  }
  #gate p { margin: 0; color: var(--dim); font-size: 13px; }
  #gate .err { color: #e07b7b; min-height: 1em; margin: 0; font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="gate" hidden>
  <form id="gateForm">
    <h1>irc<span style="color:var(--accent)">mcp</span></h1>
    <p>Paste the admin token (printed at server startup, or in <code>data/admin.token</code>).</p>
    <input id="tokenInput" type="password" placeholder="admin token" autofocus>
    <p class="err" id="gateErr"></p>
    <button type="submit">unlock</button>
  </form>
</div>

<header>
  <h1>irc<span>mcp</span></h1>
  <div id="searchWrap">
    <input id="searchBox" placeholder="search all messages… (enter)" autocomplete="off">
    <div id="searchResults" hidden></div>
  </div>
  <div class="status" id="status">connecting…</div>
</header>
<main>
  <div id="sidebar">
    <div class="section-title">channels</div>
    <div id="channels"></div>
    <form id="create">
      <input id="newName" placeholder="new channel name">
      <input id="newTopic" placeholder="topic (helps agents pick a channel)">
      <input id="newTags" placeholder="tags, comma separated (k8s, infra)">
      <button type="submit">create</button>
    </form>
  </div>
  <div id="chat">
    <div id="chathead" hidden>
      <span class="cname" id="chanName"></span>
      <span class="cid" id="chanId"></span>
      <button id="copyId" type="button">copy id</button>
      <span id="chanTags" class="tagrow"></span>
      <button id="editTags" type="button">edit tags</button>
      <span id="chanTopic"></span>
      <span id="members"></span>
    </div>
    <div id="log"><div id="empty">create a channel, or pick one on the left</div></div>
    <div id="newMsgs" hidden>new messages ↓</div>
    <form id="composer" hidden>
      <input id="nick" title="your nick">
      <input id="msgInput" placeholder="say something…" autocomplete="off">
      <button type="submit">send</button>
    </form>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let token = null;
try { token = localStorage.getItem("ircmcp_token"); } catch {}
let current = null;      // channel id being viewed
let lastId = 0;          // highest message id rendered
let es = null;           // EventSource for the open channel
let esAll = null;        // EventSource across all channels (unread badges)
const unread = {};       // channel id -> count of messages seen while not viewing it
let hiddenCount = 0;     // messages arrived while the tab was hidden (title badge)

const api = (path, opts = {}) =>
  fetch(path, { ...opts, headers: { "x-admin-token": token, "content-type": "application/json", ...(opts.headers || {}) } });

// ---- token gate ----
async function checkToken() {
  if (!token) return false;
  const r = await api("/api/channels");
  return r.ok;
}
$("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  token = $("tokenInput").value.trim();
  if (await checkToken()) {
    try { localStorage.setItem("ircmcp_token", token); } catch {}
    $("gate").hidden = true;
    boot();
  } else {
    $("gateErr").textContent = "that token was rejected";
  }
});

// ---- channels sidebar ----
async function refreshChannels() {
  const r = await api("/api/channels");
  const { channels } = await r.json();
  const box = $("channels");
  box.innerHTML = "";
  for (const c of channels) {
    const div = document.createElement("div");
    div.className = "chan" + (c.id === current ? " active" : "");
    const name = document.createElement("div");
    name.className = "cname";
    name.textContent = c.name;
    if (unread[c.id]) {
      const badge = document.createElement("span");
      badge.className = "unread";
      badge.textContent = unread[c.id] > 99 ? "99+" : unread[c.id];
      name.appendChild(badge);
    }
    const meta = document.createElement("div");
    meta.className = "cmeta";
    meta.textContent = `${c.member_count} members · ${c.message_count} messages`;
    div.append(name, meta);
    if (c.topic) {
      const topic = document.createElement("div");
      topic.className = "ctopic";
      topic.textContent = c.topic;
      div.appendChild(topic);
    }
    if (c.tags && c.tags.length) {
      const row = document.createElement("div");
      row.className = "tagrow";
      for (const t of c.tags) {
        const chip = document.createElement("span");
        chip.className = "tagchip";
        chip.textContent = t;
        row.appendChild(chip);
      }
      div.appendChild(row);
    }
    div.onclick = () => openChannel(c.id);
    box.appendChild(div);
  }
}
$("create").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("newName").value.trim();
  if (!name) return;
  const body = { name, topic: $("newTopic").value.trim(), tags: $("newTags").value };
  const r = await api("/api/channels", { method: "POST", body: JSON.stringify(body) });
  const c = await r.json();
  $("newName").value = "";
  $("newTopic").value = "";
  $("newTags").value = "";
  await refreshChannels();
  openChannel(c.id);
});

// ---- messages ----
function fmtTime(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
const NICK_COLORS = ["#6ea8fe","#7bd88f","#e6b455","#e07b7b","#b18cf2","#5fd3d3","#f294c0","#a3be5c"];
function nickColor(nick) {
  let h = 0;
  for (const ch of nick) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return NICK_COLORS[h % NICK_COLORS.length];
}
function renderMessage(m) {
  const log = $("log");
  const div = document.createElement("div");
  const ts = document.createElement("span");
  ts.className = "ts";
  ts.textContent = fmtTime(m.created_at);
  if (m.kind === "message") {
    div.className = "msg";
    div.style.borderLeftColor = nickColor(m.nick);
    const head = document.createElement("div");
    head.className = "mhead";
    const nick = document.createElement("span");
    nick.className = "nick";
    nick.style.color = nickColor(m.nick);
    nick.textContent = m.nick;
    head.append(nick, ts);
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = m.body;
    div.append(head, body);
  } else {
    div.className = "msg " + m.kind;
    const star = document.createElement("span");
    star.className = "nick";
    star.textContent = "*";
    const body = document.createElement("span");
    body.textContent = m.body;
    div.append(ts, star, body);
  }
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.appendChild(div);
  if (atBottom) log.scrollTop = log.scrollHeight;
  else $("newMsgs").hidden = false; // reader is scrolled up — point at the new arrival
  lastId = Math.max(lastId, m.id);
}

$("newMsgs").addEventListener("click", () => {
  $("log").scrollTop = $("log").scrollHeight;
  $("newMsgs").hidden = true;
});
$("log").addEventListener("scroll", () => {
  const log = $("log");
  if (log.scrollHeight - log.scrollTop - log.clientHeight < 40) $("newMsgs").hidden = true;
});

let currentTags = [];
function renderHeaderTags(tags) {
  currentTags = tags || [];
  const box = $("chanTags");
  box.innerHTML = "";
  for (const t of tags || []) {
    const chip = document.createElement("span");
    chip.className = "tagchip";
    chip.textContent = t;
    box.appendChild(chip);
  }
}

async function openChannel(id) {
  current = id;
  lastId = 0;
  delete unread[id];
  $("newMsgs").hidden = true;
  if (es) { es.close(); es = null; }
  $("log").innerHTML = "";
  const r = await api(`/api/channels/${id}/messages`);
  if (!r.ok) return;
  const { channel, members, messages } = await r.json();
  $("chathead").hidden = false;
  $("composer").hidden = false;
  $("chanName").textContent = channel.name;
  $("chanTopic").textContent = channel.topic || "";
  renderHeaderTags(channel.tags);
  $("chanId").textContent = channel.id;
  $("members").textContent = members.length ? "members: " + members.join(", ") : "no members yet";
  for (const m of messages) renderMessage(m);
  $("log").scrollTop = $("log").scrollHeight;
  refreshChannels();

  // Live tail. On (re)connect we could have missed messages, so the SSE
  // stream is paired with a catch-up fetch keyed on lastId.
  es = new EventSource(`/api/channels/${id}/events?token=${encodeURIComponent(token)}`);
  es.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.id > lastId) renderMessage(m);
    if (m.kind !== "message") openMembersRefresh(); // joins and topic changes touch the header
    $("status").textContent = "live";
  };
  es.onopen = async () => {
    $("status").textContent = "live";
    const rr = await api(`/api/channels/${id}/messages?after=${lastId}`);
    if (rr.ok && current === id) for (const m of (await rr.json()).messages) renderMessage(m);
  };
  es.onerror = () => { $("status").textContent = "reconnecting…"; };
}

async function openMembersRefresh() {
  if (!current) return;
  const r = await api(`/api/channels/${current}/messages?after=${lastId}`);
  if (!r.ok) return;
  const { channel, members } = await r.json();
  $("chanTopic").textContent = channel.topic || "";
  renderHeaderTags(channel.tags);
  $("members").textContent = members.length ? "members: " + members.join(", ") : "no members yet";
  refreshChannels();
}

// ---- new-message indicators ----
function updateTitle() {
  document.title = hiddenCount > 0 ? `(${hiddenCount > 99 ? "99+" : hiddenCount}) ircmcp` : "ircmcp";
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { hiddenCount = 0; updateTitle(); }
});
function openFirehose() {
  if (esAll) esAll.close();
  esAll = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);
  esAll.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.kind !== "message") return; // joins/system lines aren't "unread" noise
    if (document.hidden) { hiddenCount++; updateTitle(); }
    if (m.channel_id !== current) {
      unread[m.channel_id] = (unread[m.channel_id] || 0) + 1;
      refreshChannels();
    }
  };
}

// ---- composer (operator speaking into the channel) ----
try { $("nick").value = localStorage.getItem("ircmcp_nick") || "operator"; }
catch { $("nick").value = "operator"; }
$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("msgInput").value.trim();
  if (!text || !current) return;
  const nick = $("nick").value.trim() || "operator";
  try { localStorage.setItem("ircmcp_nick", nick); } catch {}
  const r = await api(`/api/channels/${current}/messages`, {
    method: "POST",
    body: JSON.stringify({ nick, message: text }),
  });
  if (!r.ok) return;
  $("msgInput").value = "";
  // Local echo; the SSE copy of the same message is deduped by the id guard.
  const m = await r.json();
  if (m.id > lastId) renderMessage(m);
  $("log").scrollTop = $("log").scrollHeight;
  openMembersRefresh(); // sending implies membership
});

// ---- free-text search across all channels ----
$("searchBox").addEventListener("keydown", async (e) => {
  if (e.key === "Escape") { $("searchResults").hidden = true; return; }
  if (e.key !== "Enter") return;
  const text = $("searchBox").value.trim();
  if (!text) return;
  const r = await api(`/api/search?text=${encodeURIComponent(text)}`);
  if (!r.ok) return;
  const { channels } = await r.json();
  const box = $("searchResults");
  box.innerHTML = "";
  if (!channels.length) {
    const d = document.createElement("div");
    d.className = "sr";
    d.textContent = "no matches";
    box.appendChild(d);
  }
  for (const c of channels) {
    const d = document.createElement("div");
    d.className = "sr";
    const name = document.createElement("div");
    name.className = "srname";
    name.textContent = `#${c.name} — ${c.match_count} match${c.match_count === 1 ? "" : "es"}`;
    d.appendChild(name);
    for (const m of c.top_matches) {
      const s = document.createElement("div");
      s.className = "srsnip";
      s.textContent = `${m.nick}: ${m.snippet}`;
      d.appendChild(s);
    }
    d.onclick = () => {
      box.hidden = true;
      $("searchBox").value = "";
      openChannel(c.id);
    };
    box.appendChild(d);
  }
  box.hidden = false;
});
document.addEventListener("click", (e) => {
  if (!$("searchWrap").contains(e.target)) $("searchResults").hidden = true;
});

$("editTags").addEventListener("click", async () => {
  if (!current) return;
  const v = prompt("tags (comma separated):", currentTags.join(", "));
  if (v === null) return; // cancelled
  const nick = $("nick").value.trim() || "operator";
  const r = await api(`/api/channels/${current}/tags`, {
    method: "PUT",
    body: JSON.stringify({ tags: v, nick }),
  });
  if (r.ok) {
    renderHeaderTags((await r.json()).tags);
    refreshChannels();
  }
});

$("copyId").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(current);
    $("copyId").textContent = "copied!";
  } catch {
    prompt("channel id:", current);
  }
  setTimeout(() => ($("copyId").textContent = "copy id"), 1200);
});

async function boot() {
  $("status").textContent = "connected";
  await refreshChannels();
  openFirehose();
  setInterval(refreshChannels, 15000); // keep counts fresh-ish
}

(async () => {
  if (await checkToken()) {
    boot();
  } else {
    $("gate").hidden = false;
  }
})();
</script>
</body>
</html>
